name: Live data sync (daily)

# Pulls real WC2026 fixtures/odds/standings (ESPN/DraftKings) + crowd markets
# (Polymarket), rebuilds docs/live/, and commits the refreshed dashboard data.
# Runs twice daily during the tournament window; also triggerable manually.

on:
  schedule:
    - cron: "0 16 * * *"    # 16:00 UTC = 19:00 Israel (IDT) — ~1h before the daily bet
    - cron: "15 11 * * *"   # 11:15 UTC daily
    - cron: "15 23 * * *"   # 23:15 UTC daily (post-matchday settle)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: "live-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Sync live data
        run: python -m wc2026.cli live-sync --days 5
      - name: Forward test — settle finished matches, then snapshot new prices+picks
        # The closing-line ledger is the only agent-independent PROOF of edge.
        # Settle first (freeze closing lines for finished games), then capture new
        # pre-kickoff prices and the model's paper picks at those exact prices.
        run: |
          python -m wc2026.cli lines settle --days 3 || echo "settle skipped"
          python -m wc2026.cli recalibrate --write || echo "recalibrate skipped"
          python -m wc2026.cli lines snapshot --days 5 || echo "snapshot skipped"
          python -m wc2026.cli lines report || true
      - name: Commit refreshed dashboard + forward-test ledger
        run: |
          git config user.name  "matchiq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/live data/linelog.jsonl
          git add data/calibration.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(live): daily data sync + forward-test ledger [skip ci]"
            git push
          fi
