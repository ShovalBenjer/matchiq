name: Live data sync (daily)

# Pulls real WC2026 fixtures/odds/standings (ESPN/DraftKings) + crowd markets
# (Polymarket), rebuilds docs/live/, and commits the refreshed dashboard data.
# Runs twice daily during the tournament window; also triggerable manually.

on:
  schedule:
    - cron: "15 11 * * *"   # 11:15 UTC daily
    - cron: "15 23 * * *"   # 23:15 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: "live-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Sync live data
        run: python -m wc2026.cli live-sync --days 5
      - name: Commit refreshed dashboard
        run: |
          git config user.name  "matchiq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/live
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(live): daily data sync [skip ci]"
            git push
          fi
