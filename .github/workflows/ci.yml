name: CI — testing pyramid

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + duckdb for the SQL probe path)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" duckdb pyarrow
      - name: Unit / integration / e2e / data / semantic tests
        run: pytest -q
      - name: Data-quality probe (SQL over the store)
        run: python -m wc2026.cli probe
      - name: Semantic / agentic-eye validation
        run: python -m wc2026.cli validate
