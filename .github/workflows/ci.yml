name: CI — testing pyramid

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install (core + duckdb for the SQL probe path)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]" duckdb pyarrow
      - name: Security scan — pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit
      - name: Unit / integration / e2e / data / semantic tests with coverage
        run: pytest --cov=wc2026 --cov-report=xml --cov-report=term
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
      - name: Data-quality probe (SQL over the store)
        run: python -m wc2026.cli probe
      - name: Semantic / agentic-eye validation
        run: python -m wc2026.cli validate
