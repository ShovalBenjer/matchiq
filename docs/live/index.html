<style>
:root{

  --accent:oklch(0.74 0.15 245); --accent2:oklch(0.76 0.18 330);

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
h1,h2,h3,.brand{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:oklch(0.3 0.03 270 / .5);
  padding:1px 6px;border-radius:6px;font-size:.85em}
/* aurora background */
.aurora{position:fixed;inset:-20% -10% auto -10%;height:120vh;z-index:-1;filter:blur(70px);
  opacity:.55;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen;
  animation:drift 22s var(--spring) infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-6vw;top:-8vw;
  background:radial-gradient(circle,oklch(0.6 0.2 270),transparent 60%)}
.aurora i:nth-child(2){width:42vw;height:42vw;right:-8vw;top:2vw;animation-delay:-7s;
  background:radial-gradient(circle,oklch(0.62 0.2 330),transparent 60%)}
.aurora i:nth-child(3){width:40vw;height:40vw;left:30vw;top:30vh;animation-delay:-13s;
  background:radial-gradient(circle,oklch(0.6 0.16 210),transparent 60%)}
@keyframes drift{to{transform:translate3d(6vw,5vh,0) scale(1.15)}}
/* layout */
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px) saturate(150%);
  background:oklch(0.16 0.03 270 / .55);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 0}
.brand{font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 var(--bad);
  animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 oklch(0.68 0.21 25 / .6)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.spacer{flex:1}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;background:var(--glass);white-space:nowrap}
/* glass card */
.glass{background:linear-gradient(180deg,var(--glass2),var(--glass));
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(140%);overflow:hidden}
.glass:hover{border-color:oklch(0.74 0.05 270 / .3)}
.card-h{display:flex;align-items:center;justify-content:space-between;

  font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
/* bento hero */
.bento{display:grid;gap:14px;margin:18px 0;
  grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(96px,auto)}
.bento .tile{padding:16px 18px}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile.wide{grid-column:span 2}
.tile .k{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-family:"Space Grotesk";font-size:30px;font-weight:700;margin-top:4px;line-height:1.05}
.tile .s{color:var(--muted);font-size:13px;margin-top:6px}
.grad{background:linear-gradient(135deg,oklch(0.74 0.15 245 / .18),oklch(0.76 0.18 330 / .14))}
/* nav pills */
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.tab{font:inherit;font-size:14px;color:var(--muted);background:var(--glass);
  border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;
  transition:transform .25s var(--spring),color .2s,border-color .2s}
.tab:hover{transform:translateY(-2px);color:var(--ink)}
.tab.active{color:var(--ink);border-color:transparent;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px -12px var(--accent)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
tbody tr{transition:background .2s}
tbody tr:hover{background:oklch(0.7 0.05 270 / .06)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.team{font-weight:600}
.flag{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;margin-right:8px;
  font-size:11px;font-weight:700;color:oklch(0.18 0.03 270);
  background:linear-gradient(135deg,var(--accent),var(--accent2));vertical-align:middle}
/* probability bar */
.bar{height:7px;border-radius:6px;background:oklch(0.4 0.03 270 / .35);overflow:hidden;min-width:64px}
.bar>i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .9s var(--spring)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.pill.value{color:var(--good);border-color:oklch(0.8 0.17 150 / .5);background:oklch(0.8 0.17 150 / .1)}
.pill.live{color:var(--bad);border-color:oklch(0.68 0.21 25 / .5);font-weight:700}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.datehead{margin:18px 2px 8px;font:600 13px "Space Grotesk";color:var(--accent);
  display:flex;align-items:center;gap:8px}
.datehead::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hidden{display:none}
section.view{animation:rise .5s var(--spring) both}
.stagger>*{animation:rise .5s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
footer{color:var(--muted);font-size:12px;padding:26px 0 48px;text-align:center}
.crosslinks{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.crosslinks a{font-size:13px;color:var(--accent);border:1px solid var(--line);

.crosslinks a:hover{transform:translateY(-2px)}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:oklch(0.4 0.03 270 / .5);border-radius:8px}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

@media (prefers-reduced-motion:reduce){

const PRM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const pct=x=>x==null?'—':(100*x).toFixed(1)+'%';
const el=(t,a={},h)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;};
const flag=name=>{const ab=(name||'?').replace(/[^A-Za-z ]/g,'').split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();return `<span class="flag">${ab||'?'}</span>`;};
function fillBars(root){(root||document).querySelectorAll('.bar>i[data-w]').forEach(i=>{
  const w=i.getAttribute('data-w');if(PRM){i.style.width=w;}else{requestAnimationFrame(()=>{i.style.setProperty('--w',w);i.style.width=w;});}});}
function countUp(node){const to=parseFloat(node.dataset.to);if(PRM||isNaN(to)){node.textContent=node.dataset.fmt.replace('#',to);return;}
  const dur=900,t0=performance.now();const fmt=node.dataset.fmt;
  function step(t){const k=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-k,3);
    node.textContent=fmt.replace('#',(to*e).toFixed(node.dataset.dp||0));if(k<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function switchView(name,btn){
  const go=()=>{document.querySelectorAll('nav.tabs .tab').forEach(b=>b.classList.toggle('active',b===btn));
    document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('hidden',s.id!=='v-'+name));
    fillBars(document.getElementById('v-'+name));};
  if(!PRM&&document.startViewTransition)document.startViewTransition(go);else go();}

document.getElementById('synced').textContent='synced '+new Date(D.generated_at).toUTCString().slice(5,22);
document.getElementById('src').textContent=D.sources.results_odds+' · '+D.sources.crowd;
document.getElementById('disc').textContent=D.disclaimer;

const fx=D.fixtures||[];
const upcoming=fx.filter(f=>f.status==='pre');
const nextM=upcoming[0]||fx[0];
const fav=(D.winner||[])[0]; const boot=(D.top_scorer||[])[0];
const valueN=fx.filter(f=>f.value&&f.value.is_value).length;

// ---- bento hero ----
function hero(){
  const h=document.getElementById('hero');h.innerHTML='';
  if(nextM){
    const b=nextM.book||{};
    h.append(el('div',{class:'glass tile big grad'},
      `<div class="k">Next kick-off</div>
       <div class="v">${flag(nextM.home)}${nextM.home}<div style="font:600 14px Inter;color:var(--muted);margin:6px 0">vs</div>${flag(nextM.away)}${nextM.away}</div>
       <div class="s" id="nextcd">—</div>
       <div style="display:flex;gap:18px;margin-top:14px">
        ${leg('Home',b.home)}${leg('Draw',b.draw)}${leg('Away',b.away)}
       </div>`));
  }
  if(fav)h.append(el('div',{class:'glass tile grad'},
    `<div class="k">Title favourite</div><div class="v"><span class="num" data-to="${(fav.prob*100).toFixed(2)}" data-dp="1" data-fmt="#%">0%</span></div>
     <div class="s">${flag(fav.team)}${fav.team} · crowd</div>`));
  if(boot)h.append(el('div',{class:'glass tile grad'},
    `<div class="k">Golden Boot</div><div class="v" style="font-size:22px">${boot.player}</div>
     <div class="s"><span class="num" data-to="${(boot.prob*100).toFixed(2)}" data-dp="1" data-fmt="#%">0%</span> · crowd</div>`));
  h.append(el('div',{class:'glass tile wide'},
    `<div class="k">Market watch</div>
     <div class="v" style="font-size:22px">${valueN?valueN+' value flag'+(valueN>1?'s':''):'Market efficient'}</div>
     <div class="s">${valueN? 'crowd beats the book on '+valueN+' line(s)':'book ≈ crowd within the vig — no free lunch in the opener'}</div>`));
  // hero stat count-ups
  h.querySelectorAll('.num').forEach(countUp);
  if(nextM)tickCountdown();
}
function leg(label,p){return `<div><div class="k">${label}</div><div style="font:700 18px 'Space Grotesk'">${pct(p)}</div></div>`;}
function tickCountdown(){
  const t=new Date(nextM.date).getTime();
  function upd(){const d=t-Date.now();const cd=document.getElementById('countdown');const nc=document.getElementById('nextcd');
    if(d<=0){if(cd)cd.textContent='⚽ underway';if(nc)nc.textContent='Kick-off';return;}
    const h=Math.floor(d/3.6e6),m=Math.floor(d%3.6e6/6e4),s=Math.floor(d%6e4/1e3);
    const txt=(h?h+'h ':'')+m+'m '+s+'s';
    if(cd)cd.textContent='next match in '+txt;
    if(nc)nc.textContent=new Date(nextM.date).toUTCString().slice(0,22)+' · in '+txt;
    setTimeout(upd,1000);}
  upd();
}

// ---- fixtures by date ----
function vFixtures(){
  const s=document.getElementById('v-fixtures');s.innerHTML='';
  const byDate={};fx.forEach(f=>{const d=(f.date||'').slice(0,10);(byDate[d]=byDate[d]||[]).push(f);});
  Object.keys(byDate).sort().forEach(d=>{
    s.append(el('div',{class:'datehead'},new Date(d).toUTCString().slice(0,16)||'TBD'));
    const card=el('div',{class:'glass'});const t=el('table');
    t.innerHTML=`<thead><tr><th>Match</th><th>Status</th><th class=num>Home</th><th class=num>Draw</th><th class=num>Away</th><th class=num>Crowd</th><th class=num>O/U</th><th>Edge</th></tr></thead>`;
    const tb=el('tbody');
    byDate[d].forEach(f=>{
      const b=f.book||{},c=f.crowd;
      const crowd=c?`${pct(c.home)} / ${pct(c.draw)} / ${pct(c.away)}`:'<span class=muted>—</span>';
      let v='<span class=muted>—</span>';
      if(f.value&&f.value.is_value)v=`<span class="pill value">${f.value.outcome} +${pct(f.value.ev)} @${f.value.offered_odds}</span>`;
      else if(f.value)v=`<span class=muted>${f.value.outcome} ${(100*f.value.ev).toFixed(1)}%</span>`;
      const st=f.status==='in'?'<span class=pill live>● LIVE</span>':(f.status==='post'?('<b>'+(f.score||'FT')+'</b>'):'<span class=muted>'+(f.date||'').slice(11,16)+'Z</span>');
      tb.append(el('tr',{}, `<td class=team>${flag(f.home)}${f.home} <span class=muted>v</span> ${flag(f.away)}${f.away}${f.details?` <span class=muted style="font-size:11px">(${f.details})</span>`:''}</td>
        <td>${st}</td><td class=num>${pct(b.home)}</td><td class=num>${pct(b.draw)}</td><td class=num>${pct(b.away)}</td>
        <td class=num style="font-size:12px">${crowd}</td><td class=num>${f.over_under??'—'}</td><td>${v}</td>`));
    });
    t.append(tb);card.append(t);s.append(card);
  });
  if(!fx.length)s.innerHTML='<div class="glass" style="padding:24px" >No fixtures in window.</div>';
}
// ---- groups (bento) ----
function vGroups(){
  const s=document.getElementById('v-groups');s.innerHTML='';
  const g=el('div',{class:'grid2'});
  Object.keys(D.groups||{}).sort().forEach(name=>{
    const card=el('div',{class:'glass'});card.append(el('div',{class:'card-h'},`<span>${name}</span><span>top 2 advance</span>`));
    const t=el('table');
    t.append(el('thead',{},'<tr><th>Team</th><th class=num>P</th><th class=num>W</th><th class=num>D</th><th class=num>L</th><th class=num>GD</th><th class=num>Pts</th></tr>'));
    const tb=el('tbody');
    (D.groups[name]||[]).forEach((r,i)=>tb.append(el('tr',{},
      `<td class=team>${i<2?'<span style="color:var(--good)">●</span> ':'<span class=muted>○</span> '}${flag(r.team)}${r.team}</td>
       <td class=num>${r.P}</td><td class=num>${r.W}</td><td class=num>${r.D}</td><td class=num>${r.L}</td>
       <td class=num>${r.GD>0?'+':''}${r.GD}</td><td class=num><b>${r.Pts}</b></td>`)));
    t.append(tb);card.append(t);g.append(card);
  });
  s.append(g);
  if(!Object.keys(D.groups||{}).length)s.innerHTML='<div class="glass" style="padding:24px">Standings unavailable.</div>';
}
// ---- knockout seeds ----
function vKo(){
  const s=document.getElementById('v-ko');s.innerHTML='';
  const g=el('div',{class:'grid2'});
  Object.keys(D.group_winners||{}).sort().forEach(grp=>{
    const card=el('div',{class:'glass'});card.append(el('div',{class:'card-h'},`<span>Group ${grp}</span><span>win group</span>`));
    const t=el('table');const tb=el('tbody');
    (D.group_winners[grp]||[]).forEach(r=>tb.append(el('tr',{},
      `<td class=team>${flag(r.team)}${r.team}</td>
       <td class=num style="width:46%"><div class="bar"><i data-w="${Math.max(3,100*r.prob)}%"></i></div></td>
       <td class=num>${pct(r.prob)}</td>`)));
    t.append(tb);card.append(t);g.append(card);
  });
  s.append(g);
  if(!Object.keys(D.group_winners||{}).length)s.innerHTML='<div class="glass" style="padding:24px">Knockout seeds appear once group markets open.</div>';
}
// ---- ranked tables (winner / scorer) ----
function vRanked(id,rows,title,who){
  const s=document.getElementById(id);s.innerHTML='';
  const card=el('div',{class:'glass'});card.append(el('div',{class:'card-h'},`<span>${title}</span><span>crowd · fair odds</span>`));
  const t=el('table');const tb=el('tbody');
  (rows||[]).forEach((r,i)=>tb.append(el('tr',{},
    `<td class=team><span class=muted>${i+1}</span>&nbsp; ${flag(r.team||r.player)}${r.team||r.player}</td>
     <td class=num style="width:42%"><div class="bar"><i data-w="${Math.max(2,100*r.prob)}%"></i></div></td>
     <td class=num>${pct(r.prob)}</td><td class=num>${r.fair_odds??'—'}</td>`)));
  t.append(tb);card.append(t);s.append(card);
  if(!(rows||[]).length)s.innerHTML='<div class="glass" style="padding:24px">'+who+' market unavailable.</div>';
}

// ---- tabs ----
const TABS=[['fixtures','Next fixtures'],['groups','Groups'],['ko','Knockout seeds'],['winner','Winner'],['scorer','Top scorer']];
const nav=document.getElementById('tabs');
TABS.forEach(([id,label],i)=>{const b=el('button',{class:'tab'+(i?'':' active')},label);b.onclick=()=>switchView(id,b);nav.append(b);});

hero();vFixtures();vGroups();vKo();
vRanked('v-winner',D.winner,'Tournament winner — Polymarket crowd','Winner');
vRanked('v-scorer',D.top_scorer,'Golden Boot — Polymarket crowd','Top-scorer');
fillBars(document.getElementById('v-fixtures'));
